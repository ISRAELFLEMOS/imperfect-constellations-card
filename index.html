<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Imperfect Constellations: musica e letra em ingles e portugues.">
  <title>Imperfect Constellations - Musica e Letra</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: #0d1829;
      --panel-2: #111f33;
      --ink: #fff6e4;
      --muted: #cbbfaa;
      --gold: #d9ad5f;
      --line: rgba(255, 246, 228, .16);
      --active: rgba(217, 173, 95, .16);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 18% 12%, rgba(217, 173, 95, .12), transparent 26%),
        linear-gradient(180deg, #050b13, var(--bg) 58%, #111824);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: clamp(18px, 4vw, 42px) 14px 42px;
    }

    header {
      display: grid;
      gap: 8px;
      margin-bottom: 18px;
    }

    .kicker {
      color: var(--gold);
      font-size: 12px;
      font-weight: 760;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
      font-size: clamp(36px, 8vw, 76px);
      line-height: .98;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .sub {
      margin: 0;
      max-width: 660px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 15px;
    }

    .player {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      gap: 12px;
      margin: 18px 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(8, 15, 26, .94);
      box-shadow: 0 18px 48px rgba(0,0,0,.32);
      backdrop-filter: blur(12px);
    }

    audio {
      width: 100%;
      accent-color: var(--gold);
    }

    .now {
      display: grid;
      gap: 4px;
      padding: 12px 14px;
      border: 1px solid rgba(217, 173, 95, .24);
      border-radius: 8px;
      background: rgba(217, 173, 95, .08);
    }

    .now-en, .now-pt {
      margin: 0;
      white-space: pre-line;
      overflow-wrap: anywhere;
      text-wrap: balance;
    }

    .now-en {
      color: #fff8e8;
      font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
      font-size: clamp(19px, 3.8vw, 31px);
      font-weight: 720;
      line-height: 1.12;
    }

    .now-pt {
      color: #f0cf91;
      font-size: clamp(13px, 2.5vw, 18px);
      font-weight: 650;
      line-height: 1.32;
    }

    .lyrics {
      display: grid;
      gap: 10px;
    }

    .lyric-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .035);
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
      scroll-margin-top: 190px;
    }

    .lyric-row.active {
      border-color: rgba(217, 173, 95, .58);
      background: var(--active);
      transform: translateY(-1px);
    }

    .line-en, .line-pt {
      margin: 0;
      white-space: pre-line;
      overflow-wrap: anywhere;
      line-height: 1.48;
    }

    .line-en {
      color: #fff3d7;
      font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
      font-size: 18px;
      font-weight: 650;
    }

    .line-pt {
      color: #d8cbb5;
      font-size: 15px;
    }

    @media (max-width: 720px) {
      main { padding-top: 16px; }

      .player {
        position: static;
      }

      .lyric-row {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="kicker">Israel & Layza</div>
      <h1>Imperfect Constellations</h1>
      <p class="sub">Apenas a musica e a letra, em ingles e portugues.</p>
    </header>

    <section class="player" aria-label="Tocador da musica">
      <audio id="song" controls preload="metadata" src="Imperfect_Constellations.mp3"></audio>
      <div class="now" aria-live="polite">
        <p class="now-en" id="nowEn">Imperfect Constellations</p>
        <p class="now-pt" id="nowPt">Constela&ccedil;&otilde;es imperfeitas</p>
      </div>
    </section>

    <section class="lyrics" id="lyrics" aria-label="Letra em ingles e portugues"></section>
  </main>

  <script>
    const cues = [
    {
        "start": 0.0,
        "end": 5.0,
        "en": "Imperfect Constellations",
        "pt": "Constela\u00e7\u00f5es imperfeitas"
    },
    {
        "start": 5.0,
        "end": 10.0,
        "en": "12 years slept between our names\nLike letters folded in the past",
        "pt": "12 anos adormeceram entre nossos nomes\nComo cartas dobradas no passado"
    },
    {
        "start": 10.0,
        "end": 15.0,
        "en": "Then life called us back again\nWhen my sky was breaking fast",
        "pt": "Ent\u00e3o a vida nos chamou de volta\nQuando meu c\u00e9u estava desabando r\u00e1pido"
    },
    {
        "start": 15.0,
        "end": 20.0,
        "en": "I was standing, or pretending\nWith a world I couldn't hold",
        "pt": "Eu estava de p\u00e9, ou apenas fingindo\nCom um mundo que eu n\u00e3o conseguia segurar"
    },
    {
        "start": 20.0,
        "end": 25.0,
        "en": "You saw more than my surrender\nMore than all the things I broke",
        "pt": "Voc\u00ea viu mais do que a minha rendi\u00e7\u00e3o\nMais do que todas as coisas que eu quebrei"
    },
    {
        "start": 25.0,
        "end": 30.0,
        "en": "You didn't carry all my weight\nYou whispered walk you're still alive",
        "pt": "Voc\u00ea n\u00e3o carregou todo o meu peso\nVoc\u00ea sussurrou: \"caminhe, voc\u00ea ainda est\u00e1 vivo\""
    },
    {
        "start": 30.0,
        "end": 35.0,
        "en": "You knew the road was mine to face\nBut gave me courage for the climb",
        "pt": "Voc\u00ea sabia que a estrada era minha para enfrentar\nMas me deu coragem para a subida"
    },
    {
        "start": 35.0,
        "end": 41.0,
        "en": "Love me with my uneven edges\nWith the truth I couldn't handle",
        "pt": "Me ame com minhas arestas irregulares\nCom a verdade com a qual eu n\u00e3o conseguia lidar"
    },
    {
        "start": 41.0,
        "end": 47.0,
        "en": "With the bridge you in your quiet battles\nIn your light and in your scars",
        "pt": "Com a ponte que voc\u00ea \u00e9 em suas batalhas silenciosas\nEm sua luz e em suas cicatrizes"
    },
    {
        "start": 47.0,
        "end": 52.0,
        "en": "To imperfect constellations\nFinding heaven where we are",
        "pt": "Para constela\u00e7\u00f5es imperfeitas\nEncontrando o para\u00edso onde estamos"
    },
    {
        "start": 52.0,
        "end": 58.0,
        "en": "Every better part I'm building\nWants to find its way to you",
        "pt": "Cada parte melhor que estou construindo\nQuer encontrar o caminho at\u00e9 voc\u00ea"
    },
    {
        "start": 58.0,
        "end": 63.0,
        "en": "You made room inside our story\nFor the little star I love",
        "pt": "Voc\u00ea abriu espa\u00e7o dentro da nossa hist\u00f3ria\nPara a estrelinha que eu amo"
    },
    {
        "start": 63.0,
        "end": 68.0,
        "en": "For the man I'm rising from\nYou became a softer place",
        "pt": "Para o homem de onde estou me erguendo\nVoc\u00ea se tornou um lugar mais suave"
    },
    {
        "start": 68.0,
        "end": 73.0,
        "en": "Not a savior not a sentence\nJust a love with honest grace",
        "pt": "N\u00e3o uma salvadora, nem uma senten\u00e7a\nApenas um amor com gra\u00e7a honesta"
    },
    {
        "start": 73.0,
        "end": 80.0,
        "en": "And we are pieces, some are lost and some are new",
        "pt": "E n\u00f3s somos pe\u00e7as, algumas perdidas e algumas novas"
    },
    {
        "start": 80.0,
        "end": 87.0,
        "en": "We didn't fit at first, we learned to shape with patient truth",
        "pt": "N\u00e3o nos encaixamos no come\u00e7o, aprendemos a nos moldar com verdade e paci\u00eancia"
    },
    {
        "start": 87.0,
        "end": 93.0,
        "en": "Love me with my uneven edges\nWith the truth I had to land on",
        "pt": "Me ame com minhas arestas irregulares\nCom a verdade na qual eu tive que aterrissar"
    },
    {
        "start": 93.0,
        "end": 99.0,
        "en": "With the bridge you in your quiet battles\nIn your light and in your scars",
        "pt": "Com a ponte que voc\u00ea \u00e9 em suas batalhas silenciosas\nEm sua luz e em suas cicatrizes"
    },
    {
        "start": 99.0,
        "end": 105.0,
        "en": "To imperfect constellations\nFinding heaven where we are",
        "pt": "Para constela\u00e7\u00f5es imperfeitas\nEncontrando o para\u00edso onde estamos"
    },
    {
        "start": 105.0,
        "end": 111.0,
        "en": "I don't promise part I'm building\nWants to find its way to you",
        "pt": "Eu n\u00e3o prometo, a parte que estou construindo\nQuer encontrar o caminho at\u00e9 voc\u00ea"
    },
    {
        "start": 111.0,
        "end": 116.0,
        "en": "If my pride should turn to silence\nIf my fear should steal my voice",
        "pt": "Se o meu orgulho se transformar em sil\u00eancio\nSe o meu medo roubar a minha voz"
    },
    {
        "start": 116.0,
        "end": 122.0,
        "en": "Let my actions say I choose you\nNot by chance but by choice",
        "pt": "Deixe minhas a\u00e7\u00f5es dizerem que eu escolho voc\u00ea\nN\u00e3o por acaso, mas por escolha"
    },
    {
        "start": 122.0,
        "end": 128.0,
        "en": "You are not the reason I'm changing\nBut the love I want to meet",
        "pt": "Voc\u00ea n\u00e3o \u00e9 a raz\u00e3o pela qual estou mudando\nMas o amor que eu quero encontrar"
    },
    {
        "start": 128.0,
        "end": 136.0,
        "en": "As the man I find within me standing stronger on his feet",
        "pt": "Como o homem que encontro dentro de mim, de p\u00e9 e mais forte"
    },
    {
        "start": 136.0,
        "end": 142.0,
        "en": "So love me where I'm still becoming\nI love you where you're learning too",
        "pt": "Ent\u00e3o me ame onde eu ainda estou me tornando\nEu te amo onde voc\u00ea est\u00e1 aprendendo tamb\u00e9m"
    },
    {
        "start": 142.0,
        "end": 148.0,
        "en": "Let the years we lost behind us\nTurn to roads we make brand new",
        "pt": "Deixe os anos que perdemos para tr\u00e1s\nSe transformarem em estradas que fazemos novas em folha"
    },
    {
        "start": 148.0,
        "end": 153.0,
        "en": "Layza, when I see you smile\nEven darkness loses room",
        "pt": "Layza, quando vejo voc\u00ea sorrir\nAt\u00e9 a escurid\u00e3o perde espa\u00e7o"
    },
    {
        "start": 153.0,
        "end": 159.0,
        "en": "Every piece of me that's healing\nFinds a home in loving you",
        "pt": "Cada peda\u00e7o de mim que est\u00e1 se curando\nEncontra um lar amando voc\u00ea"
    },
    {
        "start": 159.0,
        "end": 165.0,
        "en": "12 years a storm a second chance\nTwo hearts with no perfect map",
        "pt": "12 anos, uma tempestade, uma segunda chance\nDois cora\u00e7\u00f5es sem um mapa perfeito"
    },
    {
        "start": 165.0,
        "end": 172.0,
        "en": "I don't need a perfect story\nJust your love coming back",
        "pt": "Eu n\u00e3o preciso de uma hist\u00f3ria perfeita\nApenas do seu amor voltando"
    },
    {
        "start": 172.0,
        "end": 180.43,
        "en": "Imperfect Constellations",
        "pt": "Constela\u00e7\u00f5es imperfeitas"
    }
];
    const audio = document.getElementById('song');
    const lyrics = document.getElementById('lyrics');
    const nowEn = document.getElementById('nowEn');
    const nowPt = document.getElementById('nowPt');
    let activeIndex = -1;

    function buildLyrics() {
      const fragment = document.createDocumentFragment();
      cues.forEach((cue, index) => {
        const row = document.createElement('article');
        row.className = 'lyric-row';
        row.dataset.index = String(index);

        const en = document.createElement('p');
        en.className = 'line-en';
        en.textContent = cue.en;

        const pt = document.createElement('p');
        pt.className = 'line-pt';
        pt.textContent = cue.pt;

        row.append(en, pt);
        fragment.append(row);
      });
      lyrics.append(fragment);
    }

    function findActiveIndex(time) {
      return cues.findIndex((cue) => time >= cue.start && time < cue.end);
    }

    function renderCurrent(scrollIntoView = false) {
      const index = findActiveIndex(audio.currentTime);
      if (index === activeIndex) return;

      if (activeIndex >= 0) {
        const oldRow = lyrics.querySelector(`[data-index="${activeIndex}"]`);
        oldRow?.classList.remove('active');
      }

      activeIndex = index;
      const cue = cues[index] || cues[0];
      nowEn.textContent = cue.en;
      nowPt.textContent = cue.pt;

      if (index >= 0) {
        const row = lyrics.querySelector(`[data-index="${index}"]`);
        row?.classList.add('active');
        if (scrollIntoView && row) {
          row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    }

    buildLyrics();
    renderCurrent(false);
    audio.addEventListener('timeupdate', () => renderCurrent(!audio.paused));
    audio.addEventListener('seeked', () => renderCurrent(true));
    audio.addEventListener('play', () => renderCurrent(true));
  </script>
</body>
</html>
