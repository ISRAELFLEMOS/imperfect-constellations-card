<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cartao virtual privado de Imperfect Constellations com video original e legendas em ingles e portugues.">
  <title>Imperfect Constellations - Israel & Layza</title>
  <!-- MP4 original publicado como arquivo separado sem transcodificar. SHA-256: A7B726FA66F2F56F4AE53360E82878FE9C9F865E4B921AB7F3C40B2255F4B8D8. Tamanho original: 10942728 bytes. -->
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8f1df;
      --muted: #cfc3aa;
      --night: #07111f;
      --night-2: #111c2e;
      --paper: #efe2c4;
      --gold: #d9ad5f;
      --rose: #b76b78;
      --line: rgba(239, 226, 196, .24);
      --shadow: 0 24px 60px rgba(0, 0, 0, .42);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--night);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(135deg, rgba(239, 226, 196, .05), transparent 36%),
        linear-gradient(180deg, var(--night), #142037 54%, #2d2630);
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
      background-size: 42px 42px;
      opacity: .35;
      z-index: -1;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .experience {
      width: 100%;
      max-width: min(980px, calc(100vw - 40px));
      min-width: 0;
      display: grid;
      gap: 14px;
    }

    .topline {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      padding: 0 2px;
      min-width: 0;
    }

    .identity {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .kicker {
      color: var(--gold);
      font-size: 12px;
      font-weight: 760;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--paper);
      font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
      font-size: clamp(28px, 5vw, 54px);
      font-weight: 720;
      line-height: 1.03;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .dedication {
      margin: 0;
      color: var(--muted);
      font-size: clamp(13px, 2vw, 15px);
      line-height: 1.4;
      text-align: right;
    }

    .stage {
      position: relative;
      overflow: hidden;
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #050b13;
      box-shadow: var(--shadow);
    }

    .video-frame {
      position: relative;
      width: 100%;
      min-width: 0;
      min-height: 0;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #050b13;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #050b13;
    }

    .caption-box {
      position: absolute;
      left: clamp(10px, 3vw, 28px);
      right: clamp(10px, 3vw, 28px);
      bottom: clamp(14px, 3.4vw, 32px);
      display: grid;
      gap: 5px;
      padding: clamp(10px, 2.2vw, 18px) clamp(12px, 2.6vw, 22px);
      border: 1px solid rgba(239, 226, 196, .28);
      border-radius: 8px;
      background: rgba(5, 9, 16, .72);
      box-shadow: 0 16px 36px rgba(0, 0, 0, .32);
      backdrop-filter: blur(10px);
      transition: opacity .2s ease, transform .2s ease;
    }

    .caption-box.empty {
      opacity: 0;
      transform: translateY(8px);
    }

    .caption-en,
    .caption-pt {
      margin: 0;
      text-align: center;
      white-space: pre-line;
      overflow-wrap: anywhere;
      text-wrap: balance;
      text-shadow: 0 2px 9px rgba(0, 0, 0, .72);
    }

    .caption-en {
      color: #fff8e8;
      font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
      font-size: clamp(18px, 3.1vw, 34px);
      font-weight: 720;
      line-height: 1.12;
    }

    .caption-pt {
      color: #f0cf91;
      font-size: clamp(13px, 2vw, 20px);
      font-weight: 640;
      line-height: 1.25;
    }

    .controls {
      display: grid;
      grid-template-columns: auto auto auto auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      width: 100%;
      min-width: 0;
      padding: 12px;
      border-top: 1px solid var(--line);
      background: rgba(4, 8, 14, .78);
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      display: inline-grid;
      place-items: center;
      border: 1px solid rgba(239, 226, 196, .28);
      border-radius: 999px;
      background: rgba(239, 226, 196, .08);
      color: var(--paper);
      cursor: pointer;
      font-family: "Segoe UI Symbol", "Segoe UI", system-ui, sans-serif;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      transition: transform .16s ease, background .16s ease, border-color .16s ease;
    }

    .icon-btn:hover,
    .icon-btn:focus-visible {
      border-color: rgba(217, 173, 95, .72);
      background: rgba(217, 173, 95, .18);
      outline: none;
      transform: translateY(-1px);
    }

    .seek-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-width: 0;
    }

    .seek {
      width: 100%;
      min-width: 0;
      accent-color: var(--gold);
    }

    .time {
      min-width: 92px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      text-align: right;
    }

    .stage:fullscreen {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      border: 0;
      border-radius: 0;
      background: #050b13;
    }

    .stage:fullscreen .video-frame {
      height: 100%;
      aspect-ratio: auto;
    }

    .stage:fullscreen video {
      object-fit: contain;
    }

    @media (max-width: 720px) {
      main {
        align-items: start;
        padding: 12px;
      }

      .topline {
        align-items: start;
        display: grid;
        gap: 8px;
      }

      .dedication {
        text-align: left;
      }

      .controls {
        grid-template-columns: repeat(4, 44px);
        justify-content: space-between;
      }

      #playBtn {
        grid-column: 1;
        grid-row: 1;
      }

      #restartBtn {
        grid-column: 2;
        grid-row: 1;
      }

      #muteBtn {
        grid-column: 3;
        grid-row: 1;
      }

      #fullscreenBtn {
        grid-column: 4;
        grid-row: 1;
      }

      .seek-wrap {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .time {
        min-width: auto;
      }
    }

    @media (max-width: 520px) {
      .experience {
        max-width: min(360px, calc(100vw - 24px));
        justify-self: start;
      }
    }

    @media (max-width: 420px) {
      .caption-box {
        left: 8px;
        right: 8px;
        bottom: 10px;
      }

      .caption-en {
        font-size: clamp(15px, 5.2vw, 22px);
      }

      .caption-pt {
        font-size: clamp(11px, 3.8vw, 15px);
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="experience" aria-label="Cartao virtual Imperfect Constellations">
      <header class="topline">
        <div class="identity">
          <div class="kicker">Israel & Layza</div>
          <h1>Imperfect Constellations</h1>
        </div>
        <p class="dedication">A song for the love that found its way back.</p>
      </header>

      <section class="stage" id="stage" aria-label="Video com legendas em ingles e portugues">
        <div class="video-frame">
          <video id="songVideo" preload="metadata" playsinline poster="poster.jpg">
            <source src="Imperfect_Constellations.mp4" type="video/mp4">
          </video>
          <div class="caption-box" id="captionBox" aria-live="polite">
            <p class="caption-en" id="captionEn">Imperfect Constellations</p>
            <p class="caption-pt" id="captionPt">Constela&ccedil;&otilde;es imperfeitas</p>
          </div>
        </div>

        <nav class="controls" aria-label="Controles do cartao">
          <button class="icon-btn" id="playBtn" type="button" title="Reproduzir ou pausar" aria-label="Reproduzir ou pausar"><span id="playIcon" aria-hidden="true">&#9654;</span></button>
          <button class="icon-btn" id="restartBtn" type="button" title="Reiniciar" aria-label="Reiniciar">&#8634;</button>
          <button class="icon-btn" id="muteBtn" type="button" title="Ativar ou silenciar audio" aria-label="Ativar ou silenciar audio"><span id="muteIcon" aria-hidden="true">&#9835;</span></button>
          <button class="icon-btn" id="fullscreenBtn" type="button" title="Tela cheia" aria-label="Tela cheia">&#9974;</button>
          <div class="seek-wrap">
            <input class="seek" id="seek" type="range" min="0" max="180.43" value="0" step="0.01" aria-label="Progresso da musica">
            <span class="time" id="time">0:00 / 3:00</span>
          </div>
        </nav>
      </section>
    </section>
  </main>

  <script>
    const captionCues = [
    {
        "start": 0.0,
        "end": 5.0,
        "en": "Imperfect Constellations",
        "pt": "Constela\u00e7\u00f5es imperfeitas"
    },
    {
        "start": 5.0,
        "end": 10.0,
        "en": "12 years slept between our names\nLike letters folded in the past",
        "pt": "12 anos adormeceram entre nossos nomes\nComo cartas dobradas no passado"
    },
    {
        "start": 10.0,
        "end": 15.0,
        "en": "Then life called us back again\nWhen my sky was breaking fast",
        "pt": "Ent\u00e3o a vida nos chamou de volta\nQuando meu c\u00e9u estava desabando r\u00e1pido"
    },
    {
        "start": 15.0,
        "end": 20.0,
        "en": "I was standing, or pretending\nWith a world I couldn't hold",
        "pt": "Eu estava de p\u00e9, ou apenas fingindo\nCom um mundo que eu n\u00e3o conseguia segurar"
    },
    {
        "start": 20.0,
        "end": 25.0,
        "en": "You saw more than my surrender\nMore than all the things I broke",
        "pt": "Voc\u00ea viu mais do que a minha rendi\u00e7\u00e3o\nMais do que todas as coisas que eu quebrei"
    },
    {
        "start": 25.0,
        "end": 30.0,
        "en": "You didn't carry all my weight\nYou whispered walk you're still alive",
        "pt": "Voc\u00ea n\u00e3o carregou todo o meu peso\nVoc\u00ea sussurrou: \"caminhe, voc\u00ea ainda est\u00e1 vivo\""
    },
    {
        "start": 30.0,
        "end": 35.0,
        "en": "You knew the road was mine to face\nBut gave me courage for the climb",
        "pt": "Voc\u00ea sabia que a estrada era minha para enfrentar\nMas me deu coragem para a subida"
    },
    {
        "start": 35.0,
        "end": 41.0,
        "en": "Love me with my uneven edges\nWith the truth I couldn't handle",
        "pt": "Me ame com minhas arestas irregulares\nCom a verdade com a qual eu n\u00e3o conseguia lidar"
    },
    {
        "start": 41.0,
        "end": 47.0,
        "en": "With the bridge you in your quiet battles\nIn your light and in your scars",
        "pt": "Com a ponte que voc\u00ea \u00e9 em suas batalhas silenciosas\nEm sua luz e em suas cicatrizes"
    },
    {
        "start": 47.0,
        "end": 52.0,
        "en": "To imperfect constellations\nFinding heaven where we are",
        "pt": "Para constela\u00e7\u00f5es imperfeitas\nEncontrando o para\u00edso onde estamos"
    },
    {
        "start": 52.0,
        "end": 58.0,
        "en": "Every better part I'm building\nWants to find its way to you",
        "pt": "Cada parte melhor que estou construindo\nQuer encontrar o caminho at\u00e9 voc\u00ea"
    },
    {
        "start": 58.0,
        "end": 63.0,
        "en": "You made room inside our story\nFor the little star I love",
        "pt": "Voc\u00ea abriu espa\u00e7o dentro da nossa hist\u00f3ria\nPara a estrelinha que eu amo"
    },
    {
        "start": 63.0,
        "end": 68.0,
        "en": "For the man I'm rising from\nYou became a softer place",
        "pt": "Para o homem de onde estou me erguendo\nVoc\u00ea se tornou um lugar mais suave"
    },
    {
        "start": 68.0,
        "end": 73.0,
        "en": "Not a savior not a sentence\nJust a love with honest grace",
        "pt": "N\u00e3o uma salvadora, nem uma senten\u00e7a\nApenas um amor com gra\u00e7a honesta"
    },
    {
        "start": 73.0,
        "end": 80.0,
        "en": "And we are pieces, some are lost and some are new",
        "pt": "E n\u00f3s somos pe\u00e7as, algumas perdidas e algumas novas"
    },
    {
        "start": 80.0,
        "end": 87.0,
        "en": "We didn't fit at first, we learned to shape with patient truth",
        "pt": "N\u00e3o nos encaixamos no come\u00e7o, aprendemos a nos moldar com verdade e paci\u00eancia"
    },
    {
        "start": 87.0,
        "end": 93.0,
        "en": "Love me with my uneven edges\nWith the truth I had to land on",
        "pt": "Me ame com minhas arestas irregulares\nCom a verdade na qual eu tive que aterrissar"
    },
    {
        "start": 93.0,
        "end": 99.0,
        "en": "With the bridge you in your quiet battles\nIn your light and in your scars",
        "pt": "Com a ponte que voc\u00ea \u00e9 em suas batalhas silenciosas\nEm sua luz e em suas cicatrizes"
    },
    {
        "start": 99.0,
        "end": 105.0,
        "en": "To imperfect constellations\nFinding heaven where we are",
        "pt": "Para constela\u00e7\u00f5es imperfeitas\nEncontrando o para\u00edso onde estamos"
    },
    {
        "start": 105.0,
        "end": 111.0,
        "en": "I don't promise part I'm building\nWants to find its way to you",
        "pt": "Eu n\u00e3o prometo, a parte que estou construindo\nQuer encontrar o caminho at\u00e9 voc\u00ea"
    },
    {
        "start": 111.0,
        "end": 116.0,
        "en": "If my pride should turn to silence\nIf my fear should steal my voice",
        "pt": "Se o meu orgulho se transformar em sil\u00eancio\nSe o meu medo roubar a minha voz"
    },
    {
        "start": 116.0,
        "end": 122.0,
        "en": "Let my actions say I choose you\nNot by chance but by choice",
        "pt": "Deixe minhas a\u00e7\u00f5es dizerem que eu escolho voc\u00ea\nN\u00e3o por acaso, mas por escolha"
    },
    {
        "start": 122.0,
        "end": 128.0,
        "en": "You are not the reason I'm changing\nBut the love I want to meet",
        "pt": "Voc\u00ea n\u00e3o \u00e9 a raz\u00e3o pela qual estou mudando\nMas o amor que eu quero encontrar"
    },
    {
        "start": 128.0,
        "end": 136.0,
        "en": "As the man I find within me standing stronger on his feet",
        "pt": "Como o homem que encontro dentro de mim, de p\u00e9 e mais forte"
    },
    {
        "start": 136.0,
        "end": 142.0,
        "en": "So love me where I'm still becoming\nI love you where you're learning too",
        "pt": "Ent\u00e3o me ame onde eu ainda estou me tornando\nEu te amo onde voc\u00ea est\u00e1 aprendendo tamb\u00e9m"
    },
    {
        "start": 142.0,
        "end": 148.0,
        "en": "Let the years we lost behind us\nTurn to roads we make brand new",
        "pt": "Deixe os anos que perdemos para tr\u00e1s\nSe transformarem em estradas que fazemos novas em folha"
    },
    {
        "start": 148.0,
        "end": 153.0,
        "en": "Layza, when I see you smile\nEven darkness loses room",
        "pt": "Layza, quando vejo voc\u00ea sorrir\nAt\u00e9 a escurid\u00e3o perde espa\u00e7o"
    },
    {
        "start": 153.0,
        "end": 159.0,
        "en": "Every piece of me that's healing\nFinds a home in loving you",
        "pt": "Cada peda\u00e7o de mim que est\u00e1 se curando\nEncontra um lar amando voc\u00ea"
    },
    {
        "start": 159.0,
        "end": 165.0,
        "en": "12 years a storm a second chance\nTwo hearts with no perfect map",
        "pt": "12 anos, uma tempestade, uma segunda chance\nDois cora\u00e7\u00f5es sem um mapa perfeito"
    },
    {
        "start": 165.0,
        "end": 172.0,
        "en": "I don't need a perfect story\nJust your love coming back",
        "pt": "Eu n\u00e3o preciso de uma hist\u00f3ria perfeita\nApenas do seu amor voltando"
    },
    {
        "start": 172.0,
        "end": 180.43,
        "en": "Imperfect Constellations",
        "pt": "Constela\u00e7\u00f5es imperfeitas"
    }
];

    const video = document.getElementById('songVideo');
    const stage = document.getElementById('stage');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const restartBtn = document.getElementById('restartBtn');
    const muteBtn = document.getElementById('muteBtn');
    const muteIcon = document.getElementById('muteIcon');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const seek = document.getElementById('seek');
    const time = document.getElementById('time');
    const captionBox = document.getElementById('captionBox');
    const captionEn = document.getElementById('captionEn');
    const captionPt = document.getElementById('captionPt');

    function formatTime(value) {
      if (!Number.isFinite(value)) return '0:00';
      const minutes = Math.floor(value / 60);
      const seconds = Math.floor(value % 60).toString().padStart(2, '0');
      return `${minutes}:${seconds}`;
    }

    function activeCue(currentTime) {
      return captionCues.find((cueItem) => currentTime >= cueItem.start && currentTime < cueItem.end) || null;
    }

    function renderCaption() {
      const cueItem = activeCue(video.currentTime);
      captionBox.classList.toggle('empty', !cueItem);
      captionEn.textContent = cueItem ? cueItem.en : '';
      captionPt.textContent = cueItem ? cueItem.pt : '';
    }

    function renderState() {
      const duration = Number.isFinite(video.duration) ? video.duration : 180.43;
      seek.max = duration.toFixed(2);
      if (!seek.matches(':active')) {
        seek.value = Math.min(video.currentTime, duration).toFixed(2);
      }
      time.textContent = `${formatTime(video.currentTime)} / ${formatTime(duration)}`;
      playIcon.innerHTML = video.paused ? '&#9654;' : '&#10074;&#10074;';
      muteIcon.innerHTML = video.muted ? '&#9834;' : '&#9835;';
      renderCaption();
    }

    async function togglePlay() {
      if (video.paused) {
        try {
          await video.play();
        } catch (error) {
          playIcon.innerHTML = '&#9654;';
        }
      } else {
        video.pause();
      }
      renderState();
    }

    function restart() {
      video.currentTime = 0;
      renderState();
      video.play().catch(() => renderState());
    }

    function toggleMute() {
      video.muted = !video.muted;
      renderState();
    }

    async function toggleFullscreen() {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
        return;
      }
      if (stage.requestFullscreen) {
        await stage.requestFullscreen();
        return;
      }
      if (video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen();
      }
    }

    playBtn.addEventListener('click', togglePlay);
    restartBtn.addEventListener('click', restart);
    muteBtn.addEventListener('click', toggleMute);
    fullscreenBtn.addEventListener('click', () => toggleFullscreen().catch(() => {}));

    seek.addEventListener('input', () => {
      video.currentTime = Number(seek.value);
      renderState();
    });

    video.addEventListener('loadedmetadata', renderState);
    video.addEventListener('timeupdate', renderState);
    video.addEventListener('play', renderState);
    video.addEventListener('pause', renderState);
    video.addEventListener('ended', renderState);
    document.addEventListener('fullscreenchange', renderState);

    renderState();
  </script>
</body>
</html>
